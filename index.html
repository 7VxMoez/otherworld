<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7VxProxy · My Creations</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ================================================================
           RESET & BASE
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blood: #8b0000;
            --blood-bright: #dc2626;
            --blood-dark: #4a0000;
            --ghost: rgba(255, 255, 255, 0.85);
            --bg: #050005;
            --bg-surface: #0a0008;
            --bg-elevated: #110008;
            --border-blood: #3a0000;
            --border-glow: #5a0000;
            --text-primary: #e8d5d5;
            --text-secondary: #a08080;
            --text-muted: #5a3a3a;
            --font-display: 'Georgia', 'Palatino Linotype', serif;
            --font-body: 'Georgia', 'Palatino Linotype', serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-primary);
            overflow-x: hidden;
            font-family: var(--font-body);
            position: relative;
        }

        ::selection {
            background: #7f1d1d;
            color: #fff;
        }

        /* ================================================================
           HORROR BACKGROUND
           ================================================================ */
        .horror-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .horror-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 50% 60%, rgba(80, 0, 0, 0.25) 0%, transparent 70%),
                radial-gradient(ellipse 80% 30% at 30% 100%, rgba(0, 0, 0, 0.8) 0%, transparent 60%),
                radial-gradient(ellipse 50% 30% at 70% 20%, rgba(60, 0, 0, 0.2) 0%, transparent 60%);
            pointer-events: none;
        }

        .horror-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg,
                transparent 10%, var(--blood) 20%, var(--blood-bright) 30%,
                transparent 40%, var(--blood) 55%, var(--blood-bright) 70%,
                transparent 80%
            );
            box-shadow: 0 0 12px var(--blood), 0 0 30px rgba(139, 0, 0, 0.5);
        }

        .fog-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.15;
        }

        .fog-orb.red {
            width: 600px;
            height: 600px;
            background: var(--blood);
            top: -200px;
            right: -150px;
        }

        .fog-orb.dark {
            width: 700px;
            height: 700px;
            background: #1a0000;
            bottom: -300px;
            left: -200px;
        }

        .horror-bg .grain {
            position: absolute;
            inset: 0;
            opacity: 0.25;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.4'/%3E%3C/svg%3E");
            background-size: 180px 180px;
        }

        /* ================================================================
           TWITCH ANIMATION
           ================================================================ */
        .twitch-text {
            display: inline-block;
            font-weight: 700;
            color: var(--ghost);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow:
                -2px 0 rgba(180, 0, 0, 0.45),
                2px 0 rgba(100, 0, 0, 0.45),
                0 0 24px rgba(139, 0, 0, 0.5);
            animation: twitch 3s steps(1) infinite;
            font-family: var(--font-display);
        }

        @keyframes twitch {
            0% {
                text-shadow: -2px 0 rgba(180, 0, 0, 0.45), 2px 0 rgba(100, 0, 0, 0.45), 0 0 24px rgba(139, 0, 0, 0.5);
                transform: translate(0, 0);
            }
            12% {
                text-shadow: -6px 0 var(--blood-bright), 6px 0 rgba(255, 100, 100, 0.7), 0 2px 24px var(--blood);
                transform: translate(-5px, 2px);
            }
            16% {
                text-shadow: -2px 0 rgba(180, 0, 0, 0.45), 2px 0 rgba(100, 0, 0, 0.45), 0 0 24px rgba(139, 0, 0, 0.5);
                transform: translate(0, 0);
            }
            27% {
                text-shadow: 10px -4px var(--blood), -10px 4px rgba(255, 0, 0, 0.5), 0 0 48px rgba(139, 0, 0, 0.85);
                transform: translate(7px, -4px);
            }
            30%, 34%, 60%, 84%, 100% {
                text-shadow: -2px 0 rgba(180, 0, 0, 0.45), 2px 0 rgba(100, 0, 0, 0.45), 0 0 24px rgba(139, 0, 0, 0.5);
                transform: translate(0, 0);
            }
            32% {
                text-shadow: 5px 0 rgba(255, 100, 100, 0.9), -5px 0 var(--blood);
                transform: translate(3px, 0);
            }
            55% {
                text-shadow: -16px 6px var(--blood-bright), 16px -6px rgba(180, 0, 0, 0.85), 0 0 72px rgba(139, 0, 0, 0.65);
                transform: translate(-9px, 5px);
            }
            58% {
                text-shadow: 9px -3px rgba(255, 50, 50, 0.75);
                transform: translate(5px, -3px);
            }
            78% {
                text-shadow: -5px 10px var(--blood), 5px -10px rgba(255, 200, 200, 0.4);
                transform: translate(-3px, 7px);
            }
            81% {
                text-shadow: -2px 0 rgba(180, 0, 0, 0.45), 2px 0 rgba(100, 0, 0, 0.45), 0 0 24px rgba(139, 0, 0, 0.5);
                transform: translate(0, 0);
            }
            93% {
                text-shadow: -22px 0 var(--blood-bright), 22px 0 rgba(100, 0, 0, 1), 0 0 90px rgba(139, 0, 0, 0.75);
                transform: translate(-12px, 0);
            }
            96% {
                text-shadow: 12px 8px var(--blood);
                transform: translate(7px, 5px);
            }
        }

        /* ================================================================
           SCROLL REVEAL
           ================================================================ */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-delay-1 { transition-delay: 0.08s; }
        .reveal-delay-2 { transition-delay: 0.16s; }
        .reveal-delay-3 { transition-delay: 0.24s; }
        .reveal-delay-4 { transition-delay: 0.32s; }
        .reveal-delay-5 { transition-delay: 0.4s; }
        .reveal-delay-6 { transition-delay: 0.48s; }

        /* ================================================================
           WRAPPER
           ================================================================ */
        .wrapper {
            max-width: 1500px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* ================================================================
           HEADER
           ================================================================ */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-blood);
            padding-bottom: 1.25rem;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--blood), transparent);
            box-shadow: 0 0 15px var(--blood);
        }

        .logo h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--ghost);
            text-shadow:
                -2px 0 rgba(180, 0, 0, 0.45),
                2px 0 rgba(100, 0, 0, 0.45),
                0 0 24px rgba(139, 0, 0, 0.5);
            display: inline-block;
            font-family: var(--font-display);
        }

        .logo span {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 12px;
            letter-spacing: 4px;
            background: var(--bg-surface);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid var(--border-blood);
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .powered {
            font-size: 0.95rem;
            color: var(--text-secondary);
            background: rgba(10, 0, 8, 0.8);
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            border: 1px solid var(--border-blood);
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .powered::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(139, 0, 0, 0.15), transparent 70%);
            pointer-events: none;
        }

        .powered i {
            color: var(--blood-bright);
            font-size: 1rem;
            text-shadow: 0 0 12px var(--blood);
            animation: flicker 4s infinite alternate;
        }

        @keyframes flicker {
            0%, 90%, 100% { opacity: 1; }
            92% { opacity: 0.3; }
            94% { opacity: 1; }
            96% { opacity: 0.5; }
            98% { opacity: 1; }
        }

        .powered .powered-text {
            color: var(--ghost);
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Buttons in header */
        .nav-btn {
            background: rgba(10, 0, 8, 0.8);
            border: 1px solid var(--border-blood);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.6rem 1.3rem;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: var(--font-display);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .nav-btn:hover {
            background: rgba(30, 0, 15, 0.95);
            border-color: var(--blood-bright);
            color: var(--blood-bright);
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.4), inset 0 0 20px rgba(139, 0, 0, 0.1);
            text-shadow: 0 0 10px var(--blood-bright);
        }

        .nav-btn i {
            font-size: 0.9rem;
        }

        .nav-btn.highlight {
            border-color: var(--blood);
            color: var(--blood-bright);
            background: rgba(30, 0, 15, 0.8);
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.3);
        }

        /* ================================================================
           PAGE HERO
           ================================================================ */
        .page-hero {
            text-align: center;
            padding: 40px 20px 60px;
            position: relative;
            margin-bottom: 2rem;
        }

        .page-hero .eyebrow {
            font-size: 11px;
            letter-spacing: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 16px;
            display: block;
            font-family: var(--font-display);
        }

        .page-hero h2 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--ghost);
            text-shadow:
                -2px 0 rgba(180, 0, 0, 0.45),
                2px 0 rgba(100, 0, 0, 0.45),
                0 0 30px rgba(139, 0, 0, 0.6);
            margin-bottom: 20px;
            font-family: var(--font-display);
        }

        .page-hero p {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--text-secondary);
            letter-spacing: 2px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .page-hero .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blood-bright), transparent);
            margin: 30px auto 0;
            box-shadow: 0 0 15px var(--blood);
        }

        /* ================================================================
           PROJECTS GRID
           ================================================================ */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.2rem;
            margin-bottom: 3rem;
        }

        .project-card {
            background: rgba(10, 0, 8, 0.7);
            border: 1px solid var(--border-blood);
            border-radius: 20px;
            padding: 1.6rem 1.5rem 1.4rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(139, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            text-decoration: none;
            color: inherit;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blood), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .project-card:hover {
            border-color: var(--blood-bright);
            background: rgba(20, 0, 12, 0.9);
            transform: translateY(-5px);
            box-shadow:
                0 16px 40px -10px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(139, 0, 0, 0.35),
                inset 0 0 40px rgba(139, 0, 0, 0.08);
        }

        .project-card:hover::before {
            opacity: 1;
        }

        .project-card__icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(139, 0, 0, 0.15);
            border: 1px solid var(--border-blood);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--blood-bright);
            margin-bottom: 1.2rem;
            text-shadow: 0 0 15px var(--blood);
            transition: 0.3s;
            box-shadow: inset 0 0 20px rgba(139, 0, 0, 0.1);
        }

        .project-card:hover .project-card__icon {
            background: rgba(139, 0, 0, 0.25);
            border-color: var(--blood-bright);
            box-shadow: 0 0 25px rgba(139, 0, 0, 0.4), inset 0 0 20px rgba(139, 0, 0, 0.2);
            transform: scale(1.05);
        }

        .project-card__title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--ghost);
            margin-bottom: 0.6rem;
            font-family: var(--font-display);
            text-shadow: 0 0 15px rgba(139, 0, 0, 0.3);
        }

        .project-card__url {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
            word-break: break-all;
            padding: 0.5rem 0.7rem;
            background: rgba(5, 0, 5, 0.6);
            border-radius: 8px;
            border-left: 2px solid var(--blood);
            transition: 0.3s;
        }

        .project-card:hover .project-card__url {
            border-left-color: var(--blood-bright);
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.3);
        }

        .project-card__desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
            font-style: italic;
            margin-bottom: 1.2rem;
            flex: 1;
        }

        .project-card__footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid rgba(139, 0, 0, 0.2);
        }

        .project-card__visit {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--blood-bright);
            font-family: var(--font-display);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            text-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
        }

        .project-card:hover .project-card__visit {
            gap: 14px;
            text-shadow: 0 0 20px var(--blood-bright);
        }

        .project-card__arrow {
            color: var(--blood);
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .project-card:hover .project-card__arrow {
            color: var(--blood-bright);
            transform: translateX(4px);
        }

        /* ================================================================
           FOOTER
           ================================================================ */
        footer {
            margin-top: 3.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(139, 0, 0, 0.2);
            padding-top: 1.8rem;
            width: 100%;
            letter-spacing: 1.5px;
            font-family: var(--font-display);
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--blood), transparent);
            box-shadow: 0 0 15px var(--blood);
        }

        footer i {
            color: var(--blood-bright);
            margin: 0 4px;
            text-shadow: 0 0 10px var(--blood);
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 700px) {
            .header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .header-right { width: 100%; justify-content: space-between; }
            .logo h1 { font-size: 2rem; letter-spacing: 4px; }
            .projects-grid { grid-template-columns: 1fr; }
            .powered { font-size: 0.8rem; padding: 0.5rem 1rem; }
            .nav-btn { font-size: 0.7rem; padding: 0.5rem 1rem; letter-spacing: 1px; }
            .page-hero h2 { letter-spacing: 4px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .reveal { opacity: 1; transform: none; transition: none; }
            html { scroll-behavior: auto; }
            .twitch-text { animation: none; text-shadow: -2px 0 rgba(180,0,0,0.45), 2px 0 rgba(100,0,0,0.45), 0 0 24px rgba(139,0,0,0.5); }
            .powered i { animation: none; }
        }

        /* ================================================================
           GHOST DECORATION
           ================================================================ */
        .ghost-decoration {
            position: fixed;
            font-size: 8rem;
            font-weight: 700;
            letter-spacing: 15px;
            text-transform: uppercase;
            color: transparent;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: ghostAppear 12s steps(1) infinite;
            font-family: var(--font-display);
            user-select: none;
        }

        .ghost-decoration.g1 {
            top: 30%;
            left: -5%;
            animation-delay: 3s;
        }

        .ghost-decoration.g2 {
            bottom: 20%;
            right: -5%;
            animation-delay: 8s;
        }

        @keyframes ghostAppear {
            0%, 90%, 100% { opacity: 0; }
            92% { opacity: 0.04; color: rgba(255,255,255,0.04); text-shadow: 0 0 30px rgba(139,0,0,0.3); }
            94% { opacity: 0; }
            96% { opacity: 0.02; color: rgba(255,255,255,0.02); }
        }
    </style>
</head>

                title: "WireGuard Forge Studio",
                desc: "Forge your own VPN configurations. Secure the tunnels.",
                icon: "fa-shield-virus",
                type: "security"
            },
            {
                url: "https://7vxmoez.github.io/7VxProxy/",
                title: "7VxProxy (GitHub)",
                desc: "The original hub. The birthplace. The foundation.",
                icon: "fa-code-branch",
                type: "hub"
            },
            {
                url: "https://guns.lol/abdulmoez",
                title: "Guns.lol / AbdulMoez",
                desc: "My digital identity. All my links in one cursed place.",
                icon: "fa-address-card",
                type: "profile"
            },
            {
                url: "https://snappy-chats.lovable.app",
                title: "Snappy Chats",
                desc: "Fast, dark, ephemeral conversations. Words that vanish.",
                icon: "fa-comments",
                type: "chat"
            }
        ];

        // ==================================================================
        // RENDER PROJECTS
        // ==================================================================
        const grid = document.getElementById('projectsGrid');

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderProjects() {
            grid.innerHTML = '';
            PROJECTS.forEach((project, idx) => {
                const card = document.createElement('a');
                card.className = 'project-card reveal';
                if (idx < 6) card.classList.add(`reveal-delay-${idx + 1}`);
                card.href = project.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                card.innerHTML = `
                    <div class="project-card__icon">
                        <i class="fas ${project.icon}"></i>
                    </div>
                    <div class="project-card__title">${escapeHtml(project.title)}</div>
                    <div class="project-card__url">${escapeHtml(project.url)}</div>
                    <div class="project-card__desc">${escapeHtml(project.desc)}</div>
                    <div class="project-card__footer">
                        <span class="project-card__visit">
                            Enter <i class="fas fa-arrow-right project-card__arrow"></i>
                        </span>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // ==================================================================
        // SCROLL REVEAL
        // ==================================================================
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -40px 0px'
        });

        function observeAllReveals() {
            document.querySelectorAll('.reveal').forEach(el => {
                observer.observe(el);
            });
        }

        // Init
        renderProjects();
        observeAllReveals();

        // ==================================================================
        // PARALLAX FOG
        // ==================================================================
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(() => {
                    const scrolled = window.pageYOffset;
                    const orbs = document.querySelectorAll('.fog-orb');
                    orbs.forEach((orb, i) => {
                        const speed = (i + 1) * 0.05;
                        orb.style.transform = `translateY(${scrolled * speed}px)`;
                    });
                    ticking = false;
                });
                ticking = true;
            }
        });
    </script>
</body>
</html>
